[project]
name = "travelplanneragent"
version = "0.1.0"
description = "TravelPlannerAgent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.121.1,<1.0.0",
    "fastapi>=0.118.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    "streamlit>=1.30.0,<2.0.0",
    "fpdf2>=2.5.6,<3.0.0"
]

[project.scripts]
travelplanneragent = "travelplanneragent.main:run"
run_crew = "travelplanneragent.main:run"
train = "travelplanneragent.main:train"
replay = "travelplanneragent.main:replay"
test = "travelplanneragent.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
